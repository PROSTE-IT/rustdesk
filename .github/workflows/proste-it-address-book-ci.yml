name: PROSTE IT address book CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/shared-address-book-client
    paths:
      - build.py
      - res/msi/preprocess.py
      - libs/portable/build.rs
      - src/flutter_ffi.rs
      - src/ipc.rs
      - src/updater.rs
      - flutter/lib/common.dart
      - flutter/lib/consts.dart
      - flutter/lib/common/widgets/support_address_book.dart
      - flutter/lib/common/widgets/peer_card.dart
      - flutter/lib/common/widgets/peer_tab_page.dart
      - flutter/lib/common/widgets/peers_view.dart
      - flutter/lib/common/widgets/toolbar.dart
      - flutter/lib/desktop/pages/remote_page.dart
      - flutter/lib/desktop/pages/remote_tab_page.dart
      - flutter/lib/desktop/pages/desktop_home_page.dart
      - flutter/lib/desktop/pages/desktop_setting_page.dart
      - flutter/lib/desktop/widgets/remote_toolbar.dart
      - flutter/lib/models/model.dart
      - flutter/lib/models/peer_tab_model.dart
      - flutter/lib/models/support_address_book_model.dart
      - flutter/lib/utils/multi_window_manager.dart
      - .github/workflows/proste-it-address-book-ci.yml
      - flutter/lib/models/support_secure_storage*.dart

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Check formatting
        working-directory: flutter
        run: |
          files=(
            lib/common/widgets/support_address_book.dart
            lib/common/widgets/toolbar.dart
            lib/consts.dart
            lib/desktop/pages/desktop_home_page.dart
            lib/desktop/pages/desktop_setting_page.dart
            lib/desktop/pages/remote_tab_page.dart
            lib/desktop/widgets/remote_toolbar.dart
            lib/models/support_address_book_model.dart
            lib/models/model.dart
            lib/models/support_secure_storage.dart
            lib/models/support_secure_storage_io.dart
            lib/models/support_secure_storage_stub.dart
            lib/utils/multi_window_manager.dart
          )
          dart format "${files[@]}"
          git diff --exit-code -- "${files[@]}"

      - name: Check managed updater Rust formatting
        run: rustfmt --edition 2021 --check src/updater.rs

      - name: Analyze address book models
        working-directory: flutter
        run: |
          for source in \
            lib/models/support_address_book_model.dart \
            lib/models/support_secure_storage.dart \
            lib/models/support_secure_storage_io.dart \
            lib/models/support_secure_storage_stub.dart; do
            dart analyze "$source"
          done

      - name: Analyze address book UI
        working-directory: flutter
        run: |
          dart analyze lib/common/widgets/support_address_book.dart
          dart analyze lib/desktop/pages/desktop_home_page.dart
          dart analyze lib/desktop/pages/desktop_setting_page.dart

      - name: Analyze integration hooks
        working-directory: flutter
        run: |
          for source in \
            lib/common/widgets/peer_card.dart \
            lib/common.dart \
            lib/common/widgets/peer_tab_page.dart \
            lib/common/widgets/peers_view.dart \
            lib/common/widgets/toolbar.dart \
            lib/desktop/pages/remote_page.dart \
            lib/desktop/pages/remote_tab_page.dart \
            lib/desktop/widgets/remote_toolbar.dart \
            lib/models/peer_tab_model.dart \
            lib/consts.dart \
            lib/utils/multi_window_manager.dart; do
            dart analyze "$source"
          done

      - name: Validate Python build script
        run: python -m py_compile build.py res/msi/preprocess.py
