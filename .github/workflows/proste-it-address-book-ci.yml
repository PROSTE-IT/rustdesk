name: PROSTE IT address book CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/shared-address-book-client
    paths:
      - build.py
      - flutter/lib/common.dart
      - flutter/lib/common/widgets/support_address_book.dart
      - flutter/lib/common/widgets/peer_card.dart
      - flutter/lib/common/widgets/peer_tab_page.dart
      - flutter/lib/common/widgets/peers_view.dart
      - flutter/lib/desktop/pages/remote_page.dart
      - flutter/lib/models/model.dart
      - flutter/lib/models/peer_tab_model.dart
      - flutter/lib/models/support_address_book_model.dart
      - .github/workflows/proste-it-address-book-ci.yml
      - flutter/lib/models/support_secure_storage*.dart

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Check formatting
        working-directory: flutter
        run: |
          files=(
            lib/common/widgets/support_address_book.dart
            lib/models/support_address_book_model.dart
            lib/models/support_secure_storage.dart
            lib/models/support_secure_storage_io.dart
            lib/models/support_secure_storage_stub.dart
          )
          dart format "${files[@]}"
          git diff --exit-code -- "${files[@]}"

      - name: Analyze address book models
        working-directory: flutter
        run: |
          for source in \
            lib/models/support_address_book_model.dart \
            lib/models/support_secure_storage.dart \
            lib/models/support_secure_storage_io.dart \
            lib/models/support_secure_storage_stub.dart; do
            dart analyze "$source"
          done

      - name: Analyze address book UI
        working-directory: flutter
        run: dart analyze lib/common/widgets/support_address_book.dart

      - name: Analyze integration hooks
        working-directory: flutter
        run: |
          for source in \
            lib/common/widgets/peer_card.dart \
            lib/common.dart \
            lib/common/widgets/peer_tab_page.dart \
            lib/common/widgets/peers_view.dart \
            lib/desktop/pages/remote_page.dart \
            lib/models/peer_tab_model.dart; do
            dart analyze "$source"
          done

      - name: Validate Python build script
        run: python -m py_compile build.py
